# Portfolio Forge edge Worker: link previews, security headers, AI gateway.
# Free tier: no credit card needed for Workers, KV or Workers AI (daily free allowances apply).
name = "portfolio-forge"
main = "src/index.js"
compatibility_date = "2025-01-01"

[ai]
binding = "AI"

# Create with:  npx wrangler kv namespace create LIMITS   then paste the id below.
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_ID"

[vars]
# Where the built React app is hosted (Firebase Hosting).
ORIGIN = "https://portfolio-forge-4e0a9.web.app"
FIREBASE_PROJECT_ID = "portfolio-forge-4e0a9"
# Comma-separated browser origins allowed to call /api/* (add your custom domain).
ALLOWED_ORIGINS = "https://portfolio-forge-4e0a9.web.app,https://portfolio-forge-4e0a9.firebaseapp.com,http://localhost:3000"
DAILY_LIMIT_PER_USER = "10"
DAILY_LIMIT_GLOBAL = "100"
