# Weekly dependency and security updates. Grouped so you get a few reviewable PRs, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /portfolio-forge
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /portfolio-forge-worker
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /rules-tests
    schedule: { interval: monthly }
  - package-ecosystem: pip
    directory: /portfolio-forge-backend/functions
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
